<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background-color: #888; /* shows only until the tiles finish loading */
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  /* Full-screen canvas that holds the checkerboard background */
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }

  main {
    flex: 1; /* pushes the footer to the bottom */
  }

  footer {
    display: flex;
    justify-content: center;
    padding: 16px;
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<main></main>

<footer>
  <div style="text-align:center;">
    <!-- hitwebcounter Code START -->
    <a href="https://www.hitwebcounter.com/character-counter" target="_blank" rel="noopener" title="Total Characters">
    <img src="https://www.hitwebcounter.com/counter/counter.php?page=21529361&amp;style=0006&amp;nbdigits=5&amp;type=page" alt="Total Characters" decoding="async" style="border:0;max-width:100%;height:auto;" />
    </a>
    <br />
    <a href="https://www.hitwebcounter.com/" target="_blank" rel="noopener" style="font-family:Arial, Helvetica, sans-serif;font-size:10px;color:#636066;text-decoration:underline;font-weight:strong;">PageHits</a>
    <!-- hitwebcounter Code END -->
  </div>
</footer>

<script>
  // Checkerboard of two 64x64 tiles:
  //   jsrtile  | startile
  //   startile | jsrtile
  const TILE = 64;
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");

  function load(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("Could not load " + src));
      img.src = src;
    });
  }

  Promise.all([load("jsrtile.png"), load("startile.png")]).then(([jsr, star]) => {
    // Build one 128x128 block containing all four tiles
    const block = document.createElement("canvas");
    block.width = block.height = TILE * 2;
    const b = block.getContext("2d");
    b.drawImage(jsr,  0,    0,    TILE, TILE);
    b.drawImage(star, TILE, 0,    TILE, TILE);
    b.drawImage(star, 0,    TILE, TILE, TILE);
    b.drawImage(jsr,  TILE, TILE, TILE, TILE);

    function paint() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width  = Math.ceil(window.innerWidth  * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = ctx.createPattern(block, "repeat");
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    }

    paint();
    window.addEventListener("resize", paint);
  }).catch(err => console.error(err));
</script>

</body>
</html>
